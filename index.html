<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Le Bal des Masques</title>
  <meta name="theme-color" content="#1a1020">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bal des Masques">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07060c; color: #f3e6c8; font-family: Georgia, serif;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    #jeu, #jeu canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .ecran { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 16px; box-sizing: border-box; transition: opacity .8s; }
    #accueil { background: radial-gradient(ellipse at center, #2a1630 0%, #07060c 75%); z-index: 2; }
    #accueil h1 { font-size: clamp(2rem, 9vw, 3.4rem); margin: 0 0 8px; color: #e8cf8c; letter-spacing: .04em; }
    #accueil .sous { opacity: .75; margin: 0 0 40px; font-style: italic; }
    #accueil .entrer { animation: pulse 2s ease-in-out infinite; }
    #menu { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
    #menu [hidden] { display: none !important; }
    .grand { font: inherit; font-size: 1.05rem; color: #f3e6c8; background: rgba(232,207,140,.12); border: 1px solid rgba(232,207,140,.5);
      border-radius: 12px; padding: 12px 14px; cursor: pointer; }
    .grand:active, .grand.choisi { background: rgba(232,207,140,.35); }
    .grand small { display: block; font-size: .8rem; opacity: .7; margin-top: 2px; }
    #menu label { font-style: italic; opacity: .85; }
    #prenom { font: inherit; font-size: 1.1rem; text-align: center; color: #f3e6c8; background: rgba(0,0,0,.35);
      border: 1px solid rgba(232,207,140,.5); border-radius: 12px; padding: 10px; -webkit-user-select: text; user-select: text; }
    .genre { display: flex; gap: 10px; }
    .genre .grand { flex: 1; }
    #commencer:disabled { opacity: .4; }
    @keyframes pulse { 50% { opacity: .35; } }
    #aide { pointer-events: none; justify-content: flex-end; padding-bottom: calc(40px + env(safe-area-inset-bottom)); opacity: 0; z-index: 1; }
    #aide p { background: rgba(10,8,16,.6); padding: 10px 16px; border-radius: 20px; margin: 4px; font-size: .95rem; }
    .cache { opacity: 0 !important; pointer-events: none !important; }

    /* bulle de dialogue */
    #dialogue { position: fixed; inset: 0; z-index: 3; display: flex; align-items: flex-end; justify-content: center;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); box-sizing: border-box; transition: opacity .3s; }
    #dialogue .bulle { position: relative; width: 100%; max-width: 560px; background: rgba(14,10,20,.88); border: 1px solid rgba(232,207,140,.45);
      border-radius: 14px; padding: 14px 16px 16px; box-sizing: border-box; box-shadow: 0 6px 30px rgba(0,0,0,.6); }
    #dialogue .nom { font-weight: bold; font-size: 1.05rem; margin-bottom: 6px; letter-spacing: .03em; }
    #dialogue .texte { font-size: 1.02rem; line-height: 1.45; min-height: 2.9em; }
    #dialogue .texte em { opacity: .7; }
    #dialogue .texte.apparait { animation: apparait .35s ease-out; }
    @keyframes apparait { from { opacity: 0; transform: translateY(4px); } }
    #dialogue .choix { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    #dialogue .choix:empty { display: none; }
    #dialogue .choix button { font: inherit; font-size: .98rem; color: #f3e6c8; text-align: left; background: rgba(232,207,140,.1);
      border: 1px solid rgba(232,207,140,.35); border-radius: 10px; padding: 10px 12px; cursor: pointer; animation: apparait .3s ease-out; }
    #dialogue .choix button:active { background: rgba(232,207,140,.3); }
    #dialogue.recit { background: rgba(4,3,8,.55); }
    #dialogue .suite { position: absolute; right: 14px; bottom: 8px; font-size: .8rem; opacity: .7; animation: pulse 1.4s ease-in-out infinite; }

    /* joystick : apparaît sous le pouce gauche */
    .joystick { position: fixed; z-index: 1; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
      border: 2px solid rgba(232,207,140,.35); background: rgba(14,10,20,.25); pointer-events: none; opacity: 0; transition: opacity .15s; }
    .joystick.visible { opacity: 1; }
    .joystick div { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%;
      background: rgba(232,207,140,.55); box-shadow: 0 0 12px rgba(0,0,0,.5); }

    /* la date en haut à gauche, les boutons ronds en haut à droite */
    #hud { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px; z-index: 1; max-width: calc(100% - 200px);
      background: rgba(14,10,20,.6); border: 1px solid rgba(232,207,140,.3); border-radius: 12px; padding: 6px 10px;
      font-size: .82rem; line-height: 1.3; transition: opacity .3s; pointer-events: none; }
    #hud-conv { font-size: .75rem; opacity: .75; }
    #hud-conv:empty { display: none; }
    #ouvrir-journal { right: 120px; }
    #son { right: 66px; }
    #suivant { right: 12px; }
    #toast { position: fixed; z-index: 4; left: 50%; top: calc(70px + env(safe-area-inset-top)); transform: translate(-50%, -8px);
      max-width: calc(100% - 32px); box-sizing: border-box; background: rgba(14,10,20,.9); border: 1px solid rgba(232,207,140,.5);
      border-radius: 20px; padding: 8px 14px; font-size: .9rem; opacity: 0; transition: opacity .4s, transform .4s; pointer-events: none; }
    #toast.visible { opacity: 1; transform: translate(-50%, 0); }

    /* le journal */
    #journal { z-index: 5; background: rgba(4,3,8,.8); justify-content: flex-start; padding-top: calc(16px + env(safe-area-inset-top)); }
    #journal .panneau { width: 100%; max-width: 560px; max-height: 100%; display: flex; flex-direction: column; text-align: left;
      background: #140e1c; border: 1px solid rgba(232,207,140,.45); border-radius: 14px; overflow: hidden; }
    #journal .tete { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 0; }
    #journal h2 { margin: 0; font-size: 1.2rem; color: #e8cf8c; }
    #fermer-journal { font-size: 1.1rem; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(232,207,140,.45);
      background: transparent; color: #f3e6c8; cursor: pointer; }
    #journal .onglets { display: flex; gap: 6px; padding: 10px 14px; }
    #journal .onglets button { flex: 1; font: inherit; font-size: .9rem; color: #f3e6c8; background: transparent;
      border: 1px solid rgba(232,207,140,.3); border-radius: 10px; padding: 8px 4px; cursor: pointer; }
    #journal .onglets button.actif { background: rgba(232,207,140,.25); }
    #journal-contenu { overflow-y: auto; padding: 0 14px 14px; -webkit-overflow-scrolling: touch; }
    #journal .ligne { padding: 10px 0; border-bottom: 1px solid rgba(232,207,140,.15); display: flex; flex-direction: column; gap: 3px; }
    #journal .ligne span { opacity: .85; font-size: .95rem; line-height: 1.4; }
    #journal .vide { opacity: .6; font-style: italic; }

    /* l'écran de fin */
    #fin { z-index: 6; background: radial-gradient(ellipse at center, #2a1630 0%, #07060c 80%); gap: 14px; }
    #fin h2 { font-size: clamp(1.8rem, 8vw, 2.6rem); margin: 0; color: #e8cf8c; }
    #fin p { max-width: 460px; line-height: 1.5; margin: 0 0 16px; }
    .rond { position: fixed; top: calc(12px + env(safe-area-inset-top)); z-index: 1; width: 46px; height: 46px;
      border-radius: 50%; border: 1px solid rgba(232,207,140,.45); background: rgba(14,10,20,.6); font-size: 1.4rem;
      line-height: 1; color: #f3e6c8; cursor: pointer; transition: opacity .3s; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="jeu"></div>

  <div id="accueil" class="ecran">
    <h1>Le Bal des Masques</h1>
    <p class="sous">Six semaines avant le bal</p>
    <div id="menu">
      <p class="entrer" id="entrer">Chargement…</p>
      <button id="continuer" class="grand" hidden>Continuer<small id="continuer-detail"></small></button>
      <button id="nouvelle" class="grand" hidden>Nouvelle partie</button>
      <label for="prenom" hidden id="label-prenom">Comment t'appelles-tu ?</label>
      <input id="prenom" maxlength="16" autocomplete="off" hidden>
      <div class="genre" id="genre" hidden>
        <button class="grand" data-genre="fille">Une fille</button>
        <button class="grand" data-genre="garcon">Un garçon</button>
      </div>
      <button id="commencer" class="grand" hidden disabled>Entrer au château</button>
    </div>
  </div>

  <div id="aide" class="ecran">
    <p>Pouce gauche : marcher</p>
    <p>Glisse à droite : regarder</p>
    <p>Touche quelqu'un pour lui parler</p>
  </div>

  <div id="hud" class="cache"><div id="hud-date"></div><div id="hud-conv"></div></div>
  <button id="ouvrir-journal" class="rond cache" aria-label="Journal">📖</button>
  <button id="son" class="rond cache" aria-label="Son">🔊</button>
  <button id="suivant" class="rond cache" aria-label="Moment suivant">⏭</button>
  <div id="toast"></div>

  <div id="journal" class="ecran cache">
    <div class="panneau">
      <div class="tete"><h2>Journal</h2><button id="fermer-journal" aria-label="Fermer">✕</button></div>
      <div class="onglets">
        <button data-onglet="intrigues">Intrigues</button>
        <button data-onglet="secrets">Secrets</button>
        <button data-onglet="relations">Relations</button>
      </div>
      <div id="journal-contenu"></div>
    </div>
  </div>

  <div id="fin" class="ecran cache">
    <p style="margin:0;opacity:.7;font-style:italic">Fin</p>
    <h2 id="fin-titre"></h2>
    <p id="fin-texte"></p>
    <button id="recommencer" class="grand">Nouvelle partie</button>
  </div>

  <script type="module">
    const accueil = document.getElementById('accueil');
    const entrer = document.getElementById('entrer');
    const aide = document.getElementById('aide');

    try {
      const { demarrer } = await import('./moteur/moteur.js');
      const { construireGrandeSalle } = await import('./salles/grande-salle.js');
      const { chargerPartie, nouvellePartie } = await import('./moteur/partie.js');
      const { Histoire } = await import('./moteur/histoire.js');
      const { brancherInterface } = await import('./moteur/interface.js');
      const jeu = demarrer(document.getElementById('jeu'), construireGrandeSalle);
      const $ = (id) => document.getElementById(id);

      // entrer dans le jeu avec une partie
      function lancer(partie) {
        jeu.son.demarrer();
        accueil.classList.add('cache');
        $('prenom').blur();
        const histoire = new Histoire(jeu, partie);
        brancherInterface(jeu, histoire).montrer();
        histoire.demarrer();
        // l'aide s'affiche une fois la première scène terminée
        const attente = setInterval(() => {
          if (jeu.enDialogue || partie.d.fin) return;
          clearInterval(attente);
          aide.style.opacity = 1;
          jeu.controles.surPremierGeste = () => setTimeout(() => aide.classList.add('cache'), 1500);
        }, 500);
      }

      // le menu de départ
      const sauvegarde = chargerPartie();
      entrer.hidden = true;
      $('nouvelle').hidden = false;
      if (sauvegarde) {
        $('continuer').hidden = false;
        $('continuer-detail').textContent = `${sauvegarde.d.prenom} · ${sauvegarde.date}`;
        $('continuer').addEventListener('click', () => lancer(sauvegarde));
      }
      let genre = null;
      const verifier = () => { $('commencer').disabled = !($('prenom').value.trim() && genre); };
      $('nouvelle').addEventListener('click', () => {
        if (sauvegarde && !$('nouvelle').dataset.sur) {
          $('nouvelle').dataset.sur = '1';
          $('nouvelle').innerHTML = 'Nouvelle partie<small>Ta partie actuelle sera effacée. Touche encore pour confirmer.</small>';
          return;
        }
        for (const id of ['continuer', 'nouvelle']) $(id).hidden = true;
        for (const id of ['label-prenom', 'prenom', 'genre', 'commencer']) $(id).hidden = false;
        $('prenom').focus();
      });
      $('prenom').addEventListener('input', verifier);
      for (const b of document.querySelectorAll('#genre button')) {
        b.addEventListener('click', () => {
          genre = b.dataset.genre;
          for (const c of document.querySelectorAll('#genre button')) c.classList.toggle('choisi', c === b);
          verifier();
        });
      }
      $('commencer').addEventListener('click', () => {
        const prenom = $('prenom').value.trim().replace(/[<>{}|]/g, '');
        if (!prenom || !genre) return;
        const partie = nouvellePartie(prenom.charAt(0).toUpperCase() + prenom.slice(1), genre);
        partie.sauver();
        lancer(partie);
      });
    } catch (erreur) {
      console.error(erreur);
      entrer.textContent = 'Impossible de charger le jeu. Vérifie ta connexion internet puis recharge la page.';
    }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
  </script>
</body>
</html>
