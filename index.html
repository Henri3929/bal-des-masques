<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Le Bal des Masques</title>
  <meta name="theme-color" content="#1a1020">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bal des Masques">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07060c; color: #f3e6c8; font-family: Georgia, serif;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    #jeu, #jeu canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .ecran { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 16px; box-sizing: border-box; transition: opacity .8s; }
    #accueil { background: radial-gradient(ellipse at center, #2a1630 0%, #07060c 75%); cursor: pointer; z-index: 2; }
    #accueil h1 { font-size: clamp(2rem, 9vw, 3.4rem); margin: 0 0 8px; color: #e8cf8c; letter-spacing: .04em; }
    #accueil .sous { opacity: .75; margin: 0 0 40px; font-style: italic; }
    #accueil .entrer { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    #aide { pointer-events: none; justify-content: flex-end; padding-bottom: calc(40px + env(safe-area-inset-bottom)); opacity: 0; z-index: 1; }
    #aide p { background: rgba(10,8,16,.6); padding: 10px 16px; border-radius: 20px; margin: 4px; font-size: .95rem; }
    .cache { opacity: 0 !important; pointer-events: none !important; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="jeu"></div>

  <div id="accueil" class="ecran">
    <h1>Le Bal des Masques</h1>
    <p class="sous">La Grande Salle</p>
    <p class="entrer" id="entrer">Chargement…</p>
  </div>

  <div id="aide" class="ecran">
    <p>Touche le sol pour marcher</p>
    <p>Glisse le doigt pour regarder</p>
  </div>

  <script type="module">
    const accueil = document.getElementById('accueil');
    const entrer = document.getElementById('entrer');
    const aide = document.getElementById('aide');

    try {
      const { demarrer } = await import('./moteur/moteur.js');
      const { construireGrandeSalle } = await import('./salles/grande-salle.js');
      const jeu = demarrer(document.getElementById('jeu'), construireGrandeSalle);
      entrer.textContent = "Touche l'écran pour entrer";
      accueil.addEventListener('click', () => {
        accueil.classList.add('cache');
        aide.style.opacity = 1;
        jeu.controles.surPremierGeste = () => setTimeout(() => aide.classList.add('cache'), 1500);
      }, { once: true });
    } catch (erreur) {
      console.error(erreur);
      entrer.textContent = 'Impossible de charger le jeu. Vérifie ta connexion internet puis recharge la page.';
    }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
  </script>
</body>
</html>
